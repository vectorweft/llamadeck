    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      try {
        // The app shipped as "LSC" and stored its UI preferences under
        // lsc-*. Carry them over once, here, before anything reads them —
        // otherwise the rename silently resets everyone's theme, language and
        // zoom back to the defaults on the first launch after upgrading.
        for (const key of ['theme', 'lang', 'zoom', 'preset-drawer-w']) {
          const legacy = localStorage.getItem('lsc-' + key);
          if (legacy !== null) {
            if (localStorage.getItem('llamadeck-' + key) === null) {
              localStorage.setItem('llamadeck-' + key, legacy);
            }
            localStorage.removeItem('lsc-' + key);
          }
        }
        if (localStorage.getItem('llamadeck-theme') === 'graphite') {
          document.documentElement.dataset.theme = 'graphite';
        }
        // lang is not decoration: CSS text-transform is language-sensitive, and
        // every uppercased heading in the app is wrong in Turkish without it —
        // "Sistem" uppercases to SISTEM instead of SİSTEM, "Güç tüketimi" to
        // GÜÇ TÜKETIMI instead of GÜÇ TÜKETİMİ. Set here rather than only on
        // toggle so the first paint is already correct.
        if (localStorage.getItem('llamadeck-lang') === 'tr') {
          document.documentElement.lang = 'tr';
        }
        // A ?pane=1 document is the right half of a split view. Mark it before
        // paint so the prerendered rail never flashes there, and leave its zoom
        // alone — the parent already zooms the <iframe> box.
        var pane = location.search.indexOf('pane=') !== -1;
        if (pane) {
          document.documentElement.dataset.pane = '1';
        } else {
          var z = parseFloat(localStorage.getItem('llamadeck-zoom') || '1');
          if (z > 0 && Math.abs(z - 1) > 0.001) {
            document.documentElement.style.zoom = String(z);
            document.documentElement.style.setProperty('--zoom', String(z));
          }
        }
      } catch (e) { /* localStorage unavailable — keep defaults */ }
    </script>
